[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patho-spar"
version = "0.1.0"
description = "Attack-only implementation of the Patho-SPAR stain-physics threat model"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "torch>=1.13",
  "numpy>=1.23",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "timm>=0.6.12",
  "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "ruff>=0.4"]

[project.scripts]
patho-spar-attack = "patho_spar.cli.attack_image:main"
patho-spar-evaluate = "patho_spar.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
